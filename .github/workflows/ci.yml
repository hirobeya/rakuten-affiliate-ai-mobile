name: Verify Urenavi
on: [push, pull_request]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
  apply-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ai-evidence-universal-copy-v5-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 .github/scripts/apply-v5.py
      - run: npm run test:copy && npm run test:ai
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use validated AI evidence for universal product copy [v5-applied]"
          git push origin HEAD:fix-ai-evidence-universal-copy-v5-20260926
