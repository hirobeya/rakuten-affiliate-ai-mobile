name: Verify Urenavi
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify isolated core with network and credential guard
        run: bash scripts/rebuild/offline.sh --test tests/rebuild/*.test.js
      - name: Verify existing regression with network guard
        run: bash scripts/rebuild/regression.sh
