name: ROOM Copy Regression

on:
  push:
    branches:
      - main
      - production-rule-ai-release-20260923
  pull_request:

jobs:
  test-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm run test:copy
