name: Framework Corpus Analysis

on:
  push:
    branches:
      - v3-value-architecture-fix-20260929
    paths:
      - 'scripts/analyze-framework-corpus.js'
      - 'tests/fixtures/rakuten-large-genres-20260925-*.json'
      - 'package.json'
      - '.github/workflows/framework-corpus-analysis.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run corpus analysis
        run: npm run test:framework

      - name: Upload full corpus report
        uses: actions/upload-artifact@v4
        with:
          name: framework-corpus-report
          path: tests/reports/framework-corpus-report.json
          if-no-files-found: error
