name: ROOM Copy Regression

on:
  push:
  pull_request:

jobs:
  test-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Run ROOM copy regression tests
        run: npm run test:copy
