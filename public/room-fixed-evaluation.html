<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOM Preview 実測</title><style>body{font:16px sans-serif;max-width:900px;margin:20px auto;padding:12px}button,input{padding:10px;margin:5px}textarea{width:100%;height:300px}pre{white-space:pre-wrap}table{width:100%}td{padding:8px;border-bottom:1px solid #ccc}</style><h1>Preview 原文固定実測</h1><p>検索品質と生成品質を分けて記録。AIの完成判定は人手品質確認の合格を意味しません。</p><label>実測モデル<select id="model"><option value="openai/gpt-oss-120b">120B（通常設定）</option><option value="openai/gpt-oss-20b">20B（比較評価・未検証）</option></select></label><button id="glove">バイクグローブ3回</button><button id="all">確認済み原文を各3回</button><button id="unseen">未見17商品の各3回</button><button id="holdout9">完全新規holdout9を各1回</button><button id="stop">停止</button><button id="export">結果を表示</button><button id="peek">直近の未完了状態を確認（AI呼出しなし）</button><pre id="peekResult"></pre><p id="state"></p><table id="rows"></table><h2>原文収集</h2><input id="keyword" placeholder="商品検索語"><button id="search">原文検索</button><pre id="sources"></pre><button id="collect">17カテゴリの原文候補を収集</button><textarea id="collected" readonly></textarea><textarea id="json" readonly></textarea><script src="/room-preview-request.js"></script><script>
const key='room-fixed-evaluation-20261004';let results=JSON.parse(localStorage.getItem(key)||'[]'),running=false,controller;const $=id=>document.getElementById(id);function show(){ $('rows').replaceChildren();for(const r of results){let tr=document.createElement('tr');for(const text of [r.category,r.model||r.result?.model||'不明',r.run,r.result?.quality?.status||r.status,r.result?.quality?.text||(r.result?.quality?.reasons||[]).map(x=>typeof x==='string'?x:[x.rule,x.detail].filter(Boolean).join(': ')).join(' / ')]){let td=document.createElement('td');td.textContent=text;tr.append(td)}$('rows').append(tr)}$('json').value=JSON.stringify(results,null,2)}
async function run(only,unseen=false,fixtureUrl='',runsPerFixture=3){if(running)return;running=true;controller=new AbortController();try{const evaluationModel=$('model').value;const response=await fetch(fixtureUrl||(unseen?'/room-unseen-evaluation-fixtures.json':'/room-evaluation-fixtures.json'));const fixtures=await response.json();const version=await (await fetch('/room-evaluation-version.json')).json();for(const f of fixtures.filter(x=>only?x.id==='01':x.categoryChecked)){for(let run=1;run<=runsPerFixture;run++){if(results.some(r=>r.status===200&&(r.model||r.result?.model)===evaluationModel&&r.fixtureId===f.id&&r.run===run&&r.result?.version===version.version&&r.item.itemCode===f.item.itemCode&&r.item.itemName===f.item.itemName&&r.item.itemCaption===f.item.itemCaption))continue;if(controller.signal.aborted)throw new Error('停止');const previous=[...results].reverse().find(r=>(r.model||r.result?.model)===evaluationModel&&r.fixtureId===f.id&&r.run===run&&r.status===429&&r.result?.version===version.version&&r.item.itemCode===f.item.itemCode&&r.item.itemName===f.item.itemName&&r.item.itemCaption===f.item.itemCaption);const evaluationRun=previous?.evaluationRun||'fixed_'+Date.now()+'_'+f.id+'_'+run;const startedAt=previous?.startedAt||new Date().toISOString();$('state').textContent=f.category+' '+run+'回目';const start=performance.now();const out=await RoomPreviewRequest.run({...f.item,evaluationRun,evaluationModel},{signal:controller.signal,onStage:phase=>$('state').textContent=f.category+' '+run+'回目 '+phase});results.push({model:evaluationModel,fixtureId:f.id,category:f.category,set:f.set,item:f.item,evaluationRun,run,startedAt,elapsedMs:Date.now()-Date.parse(startedAt),status:out.status,result:out.data,humanReview:null});localStorage.setItem(key,JSON.stringify(results));show();if(out.status!==200)throw new Error('API '+out.status+'：'+JSON.stringify(out.data));}}}catch(e){$('state').textContent=e.message}finally{running=false}}
$('glove').onclick=()=>run(true);$('all').onclick=()=>run(false);$('unseen').onclick=()=>run(false,true);$('holdout9').onclick=()=>run(false,false,'/room-holdout9-evaluation-fixtures.json',1);$('stop').onclick=()=>controller?.abort();$('export').onclick=show;$('peek').onclick=async()=>{const last=[...results].reverse().find(r=>r.status===429);if(!last){$('peekResult').textContent='未完了の実測なし';return;}const response=await fetch('/api/room-ai-v3',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({...last.item,evaluationRun:last.evaluationRun,evaluationModel:last.model||last.result.model||'openai/gpt-oss-120b',statusOnly:true})});const data=await response.json();$('peekResult').textContent=JSON.stringify(data,null,2);if(data.version&&data.groq?.totalCalls>0&&!last.result.version){last.result.version=data.version;last.result.model=data.model;last.model=data.model;localStorage.setItem(key,JSON.stringify(results));show();}};$('search').onclick=async()=>{const res=await fetch('/api/search?'+new URLSearchParams({keyword:$('keyword').value,sort:'-reviewCount',minPrice:'100',maxPrice:'30000'}));$('sources').textContent=JSON.stringify(await res.json(),null,2)};$('collect').onclick=async()=>{const queries=['バイクグローブ','掃除 マイクロファイバー 手袋','野球 グローブ','収納ベンチ','モップハンガー','空調服 バッテリー','ペット 毛取り グルーミング グローブ','BOS 袋','美顔ローラー','モバイルバッテリー','フライパン','収納ボックス','ヘアブラシ','ペット ベッド','靴下','電気ケトル','お米'];const all=[];for(const keyword of queries){$('sources').textContent='原文収集：'+keyword;const response=await fetch('/api/search?'+new URLSearchParams({keyword,sort:'-reviewCount',minPrice:'100',maxPrice:'30000'}));const data=await response.json();await new Promise(resolve=>setTimeout(resolve,1500));all.push({keyword,status:response.status,collectedAt:new Date().toISOString(),data});$('collected').value=JSON.stringify(all,null,2);localStorage.setItem(key+'-sources',$('collected').value);if(response.status!==200)break;}$('sources').textContent='原文収集 '+all.length+'カテゴリ完了';};$('collected').value=localStorage.getItem(key+'-sources')||'[]';show();
</script></html>
