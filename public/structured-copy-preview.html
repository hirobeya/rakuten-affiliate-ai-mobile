<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ウレナビ 投稿文構造の検証</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:1000px;margin:24px auto;padding:16px;color:#172535;background:#f5f8fc}h1{font-size:24px}select,textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border:1px solid #a6b7cc;border-radius:8px}textarea{min-height:130px}button{background:#164c8e;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{background:white;padding:18px;border-radius:12px;border:1px solid #d7e0ed}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}h2{font-size:18px}.note{font-size:14px;color:#526174}details pre{font:14px/1.6 monospace}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><h1>ウレナビ 投稿文構造の検証</h1><p class="note">本番未反映の比較画面です。バイクグローブ以外は構造テスト用の入力例で、実在商品の仕様を確認した結果ではありません。画像・ライブAIは未検証です。</p><label>分類<select id="category"></select></label><label>商品名<textarea id="title"></textarea></label><label>商品説明<textarea id="caption" placeholder="説明文がある場合に入力"></textarea></label><button id="generate">この入力で確認</button><p id="status"></p><section class="grid"><article><h2>修正前（保存済み比較）</h2><pre id="before"></pre></article><article><h2>修正後（共通生成器）</h2><pre id="after"></pre></article></section><details><summary>根拠とルート一致</summary><pre id="evidence"></pre></details><script src="/structured-room-copy.js"></script><script src="/fact-safety.js"></script><script src="/pain-copy.js"></script><script src="/room-copy-quality.js"></script><script src="/structured-copy-preview.js"></script></html>
