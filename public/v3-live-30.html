<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ウレナビ v3 実商品検証</title><style>body{font-family:system-ui,sans-serif;background:#f6f7f8;color:#17212b;margin:0}main{max-width:850px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:14px;margin:16px 0}button,input,select{font:inherit;padding:12px;margin:4px 0}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}input,select,textarea{box-sizing:border-box;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.error{color:#b42318}.copy{background:#f3f7fa;padding:16px;border-radius:10px}textarea{min-height:180px}small{display:block;line-height:1.7}.release{border:2px solid #172a4b}.release button{width:100%;font-weight:800}.ok{color:#067647;font-weight:800}.ng{color:#b42318;font-weight:800}</style></head><body><main>
<h1>ウレナビ v3 実商品検証</h1>
<p>オーナー認証済みPreview専用。検索ではAIを呼びません。商品を選んで1件ずつ生成し、投稿文と根拠を確認します。</p>
<a href="/app.html" target="_blank" rel="noopener">ウレナビにログインする</a>
<section class="release"><h2>販売前30件テスト</h2><p><strong>6カテゴリ × 各5商品 ＝ 合計30商品</strong>を順番に実測します。収納ボックス／モバイルバッテリー／ペットベッド／フライパン／電気ケトル／折りたたみ傘。</p><button id="batch30">30件を自動検証する</button><button id="resume30" disabled>停止位置から再開する</button><p id="batchStatus">未実行（0 / 30）</p><p id="batchSummary"></p></section>
<section><label for="keyword">検索キーワード</label><input id="keyword" value="収納ボックス" list="keywords"><datalist id="keywords"><option>収納ボックス</option><option>モバイルバッテリー</option><option>ペットベッド</option><option>フライパン</option><option>電気ケトル</option><option>折りたたみ傘</option></datalist><button id="search">商品を検索</button><label for="products">実際の商品を選択</label><select id="products"><option value="">検索してください</option></select><button id="generate" disabled>選んだ商品の投稿文を生成</button><button id="repeat" disabled>同じ商品で再実行・キャッシュ確認</button><p id="status" role="status">待機中</p></section>
<section id="source"><h2>商品の情報</h2><div id="sourceText"></div></section>
<section><h2>生成された投稿文</h2><div id="copies">未生成</div><p id="quality"></p><label for="review">人による評価：商品判別・事実性・購入メリット・文章の刺さり</label><textarea id="review" placeholder="合格／不合格と理由を記録"></textarea><button id="saveReview" disabled>この結果の評価を記録</button></section>
<section><h2>実測記録</h2><p id="summary">0件</p><button id="export">結果JSONを表示</button><textarea id="json" readonly aria-label="検証結果JSON"></textarea><details><summary>最新のAPI応答と根拠</summary><pre id="details"></pre></details></section>
<script src="/v3-live-validation.js?v=20260929-release30-r3"></script></main></body></html>
