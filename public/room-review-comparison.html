<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定草稿の審査比較</title><style>body{font:16px system-ui;max-width:850px;margin:24px auto;padding:16px}button,select{font:inherit;padding:10px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f7;padding:14px}textarea{width:100%;height:330px}</style><h1>固定草稿の審査比較（開発用）</h1><p>草稿と原文は変更しません。1回の操作で審査のみ1回。待機・失敗時は自動再送しません。結果は通常の投稿文として公開しません。</p><select id="case" aria-label="固定草稿"></select><select id="variant" aria-label="審査指示"><option value="after">修正後</option><option value="before">修正前</option></select><button id="run" disabled>この草稿を審査</button><button id="status" disabled>保存結果だけ確認</button><button id="reconcile">保存済み完了記録で予算を照合（送信なし）</button><p id="state">認証を確認しています。</p><h2>評価対象の草稿</h2><pre id="draft"></pre><h2>結果</h2><textarea id="result" readonly aria-label="審査結果"></textarea><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://upooxcugrplfmjnqpuxs.supabase.co','sb_publishable_OBQUoiuGzy_YagoMeAnHYg_BTNfn8j5',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});const $=id=>document.getElementById(id);let cases=[];
async function request(method,body){const {data}=await sb.auth.getSession();const headers={'Content-Type':'application/json'};if(data?.session?.access_token)headers.Authorization='Bearer '+data.session.access_token;const r=await fetch('/api/room-ai-v3?urenaviReviewComparison=1',{method,headers,credentials:'include',...(body?{body:JSON.stringify(body)}:{})});return {status:r.status,data:await r.json()};}
function show(){const c=cases.find(c=>c.id===$('case').value);$('draft').textContent=c?c.draft.sentences.map(x=>x.text).join('\n\n'):'';}
async function run(statusOnly){$('run').disabled=$('status').disabled=true;try{$('state').textContent=statusOnly?'保存結果を確認中':'固定草稿を審査中';const r=await request('POST',{caseId:$('case').value,variant:$('variant').value,...(statusOnly?{statusOnly:true}:{})});$('result').value=JSON.stringify(r,null,2);$('state').textContent=r.status===202?'未完了。待機の目安は約'+Math.ceil((r.data.retryAfterMs||0)/1000)+'秒。自動では再開しません。':r.status===200?'審査結果を記録しました。公開用の完成判定ではありません。':'停止しました。追加送信していません。';}catch{$('state').textContent='通信に失敗しました。自動では再送しません。';}finally{$('run').disabled=$('status').disabled=false;}}
$('reconcile').onclick=async()=>{ $('reconcile').disabled=true;try{const r=await request('POST',{reconcile:true});$('result').value=JSON.stringify(r,null,2);$('state').textContent=r.status===200?'完了記録と使用量を照合しました。追加AI送信は0回です。':'照合できないため停止を維持しています。';}catch{$('state').textContent='照合できないため停止を維持しています。';}finally{$('reconcile').disabled=false;}};
$('case').onchange=show;$('run').onclick=()=>run(false);$('status').onclick=()=>run(true);(async()=>{try{const r=await request('GET');if(r.status!==200)throw Error();cases=r.data.cases;for(const c of cases){const o=document.createElement('option');o.value=c.id;o.textContent=c.label;$('case').append(o);}show();$('run').disabled=$('status').disabled=false;$('state').textContent='原文と草稿を固定しました。';}catch{$('state').textContent='オーナーの開発版ログインが必要です。';}})();
</script></html>
