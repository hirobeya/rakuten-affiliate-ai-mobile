<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ウレナビ v4 試作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17223b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:680px;margin:auto;padding:16px 12px 56px}h1{font-size:23px;margin:0}.sub{font-size:12px;color:#667085;line-height:1.6;margin:5px 0 14px}.box,.card{background:#fff;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 5px 20px #0000000a}label{display:block;font-size:12px;font-weight:900;margin:10px 0 5px}input,select,button{width:100%;min-height:48px;border-radius:13px;font-size:16px}input,select{border:1px solid #dfe3e8;background:#fff;padding:10px 12px}button{border:0;padding:11px 12px;font-weight:900}.primary{background:#b73727;color:#fff;margin-top:12px}.secondary{background:#172a4b;color:#fff;margin-top:8px}.ghost{background:#eef1f4;color:#344054;margin-top:7px}.muted{font-size:11px;color:#7a8391;line-height:1.55;margin-top:7px}.status{font-size:12px;font-weight:800;line-height:1.55;margin-top:9px}.card h2{font-size:14px;line-height:1.45;margin:0 0 5px}.price{font-size:18px;font-weight:950}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.metric{background:#f7f8fa;border-radius:10px;padding:8px;text-align:center}.metric b{display:block;font-size:15px}.metric span{font-size:9px;color:#6f7785}.why{margin-top:8px;padding:9px;border-radius:11px;background:#f8fbff;border:1px solid #dfeaf6;font-size:11px;line-height:1.55}.copy{white-space:pre-wrap;background:#fafafa;border:1px solid #e1e5ea;border-radius:12px;padding:11px;font-size:13px;line-height:1.6;margin-top:9px}.facts{padding-left:18px;font-size:11px;line-height:1.55}.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0}.step{background:#e9edf2;border-radius:999px;height:7px}.step.on{background:#b73727}.time{font-size:12px;font-weight:900;color:#8f2f22;margin-top:8px}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:440px){.metrics{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body><main class="w">
<h1>ウレナビ v4 試作</h1>
<div class="sub">目的：商品発見 → 比較 → 選定 → 理解 → 投稿文 → 投稿準備を、iPhoneだけで短時間に終わらせる。</div>
<div class="bar" aria-label="進捗"><i class="step" id="s1"></i><i class="step" id="s2"></i><i class="step" id="s3"></i><i class="step" id="s4"></i><i class="step" id="s5"></i><i class="step" id="s6"></i></div>
<section class="box">
<label>探したい商品・悩み</label><input id="keyword" placeholder="例：洗面所 収納 / ペット 毛 掃除">
<div class="row"><div><label>最低価格</label><select id="min"><option value="">指定なし</option><option value="500">500円〜</option><option value="1000">1,000円〜</option><option value="3000">3,000円〜</option><option value="5000">5,000円〜</option></select></div><div><label>最高価格</label><select id="max"><option value="">指定なし</option><option value="3000">〜3,000円</option><option value="5000">〜5,000円</option><option value="10000">〜10,000円</option><option value="30000">〜30,000円</option></select></div></div>
<button id="searchBtn" class="primary">候補を3つに絞る</button><div id="status" class="status"></div>
</section>
<section id="results"></section>
<section id="prep" class="box hidden"><h2 style="font-size:16px;margin:0">投稿準備</h2><div id="summary" class="status"></div><ul id="facts" class="facts"></ul><div id="copy" class="copy"></div><button id="copyBtn" class="secondary">投稿文をコピー</button><a id="rakutenBtn" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener"><button class="ghost" type="button">楽天市場で最終確認</button></a><div id="elapsed" class="time"></div><button id="saveRunBtn" class="ghost">今回の所要時間を自己検証に保存</button><div id="saved" class="muted"></div></section>
<section class="box"><b style="font-size:13px">2週間自己検証</b><div class="muted">この試作では検索開始から投稿文準備完了までの時間を自動計測します。ツールなし／ChatGPT無料版／ウレナビの同じ課題で比較し、ChatGPTより遅い工程を特定して改善します。</div><div id="history" class="muted"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
<script>
const SUPABASE_URL='https://upooxcugrplfmjnqpuxs.supabase.co';
const SUPABASE_KEY='sb_publishable_OBQUoiuGzy_YagoMeAnHYg_BTNfn8j5';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage}});
const $=id=>document.getElementById(id);let startedAt=0,selected=null,preparedAt=0;
function steps(n){for(let i=1;i<=6;i++)$('s'+i).classList.toggle('on',i<=n)}
async function token(){const {data}=await sb.auth.getSession();const t=data?.session?.access_token;if(!t)throw new Error('先に通常のウレナビでログインしてください。');return t}
function q(v){return encodeURIComponent(String(v||''))}
function imageOf(x){const a=Array.isArray(x.mediumImageUrls)?x.mediumImageUrls:[];const v=a[0];return typeof v==='string'?v:(v&&v.imageUrl)||''}
function candidateReason(x){const parts=[];if(x.relevance>=84)parts.push('検索意図との一致が高い');if(x.reviewCount>0)parts.push('レビュー情報を比較できる');if(x.affiliateRate>0)parts.push('料率を確認できる');return parts.length?parts.join('・'):'価格・商品情報を並べて比較できます'}
function renderHistory(){const runs=JSON.parse(localStorage.getItem('urenavi_v4_self_runs')||'[]');$('history').textContent=runs.length?`保存済み ${runs.length}件｜直近 ${runs[0].seconds}秒（${runs[0].keyword}）`:'まだ記録はありません。'}
$('searchBtn').onclick=async()=>{const keyword=$('keyword').value.trim();if(!keyword)return;$('status').textContent='候補を探しています…';$('results').innerHTML='';$('prep').classList.add('hidden');startedAt=Date.now();preparedAt=0;steps(1);try{const t=await token();const params=new URLSearchParams({keyword,sort:'-reviewCount'});if($('min').value)params.set('minPrice',$('min').value);if($('max').value)params.set('maxPrice',$('max').value);const r=await fetch('/api/search?'+params,{headers:{Authorization:'Bearer '+t},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||'検索失敗');const items=(d.items||[]).slice(0,3);steps(2);$('status').textContent=`${d.count||items.length}件から、比較候補を${items.length}件に絞りました。`;$('results').innerHTML='';items.forEach((x,i)=>{const e=document.createElement('article');e.className='card';const img=imageOf(x);e.innerHTML=`${img?`<img src="${img}" alt="" style="width:82px;height:82px;object-fit:cover;border-radius:11px;float:left;margin-right:10px">`:''}<h2>${i+1}. ${String(x.itemName||'').replace(/[<>]/g,'')}</h2><div class="price">¥${Number(x.itemPrice||0).toLocaleString()}</div><div style="clear:both"></div><div class="metrics"><div class="metric"><b>${x.relevance??'-'}</b><span>検索一致</span></div><div class="metric"><b>${Number(x.reviewCount||0).toLocaleString()}</b><span>レビュー件数</span></div><div class="metric"><b>${x.affiliateRate??'-'}%</b><span>料率</span></div></div><div class="why">候補理由：${candidateReason(x)}</div><button class="secondary">この商品を理解して投稿準備</button>`;e.querySelector('button').onclick=()=>prepare(x);$('results').appendChild(e)});}catch(err){$('status').textContent=err.message||'処理できませんでした';}}
async function prepare(x){selected=x;steps(3);$('prep').classList.remove('hidden');$('summary').textContent='商品情報を確認して投稿文を作成しています…';$('facts').innerHTML='';$('copy').textContent='';window.scrollTo({top:$('prep').offsetTop-12,behavior:'smooth'});try{const t=await token();const body={itemCode:x.itemCode,itemName:x.itemName,itemPrice:x.itemPrice,catchcopy:x.catchcopy,itemCaption:x.itemCaption,description:x.itemCaption,imageUrl:imageOf(x)};const r=await fetch('/api/room-ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.copyReady)throw new Error(d.message||'投稿文を作れませんでした');steps(4);$('summary').textContent=d.product_summary||x.itemName;const facts=Array.isArray(d.facts_used)?d.facts_used:[];for(const f of facts){const li=document.createElement('li');li.textContent=typeof f==='string'?f:(f.quote||f.text||JSON.stringify(f));$('facts').appendChild(li)}steps(5);$('copy').textContent=d._v3Copy||d.post_text||'';$('rakutenBtn').href=x.itemUrl||'#';preparedAt=Date.now();steps(6);$('elapsed').textContent=`検索開始 → 投稿準備完了：${Math.round((preparedAt-startedAt)/1000)}秒`;$('saved').textContent='';}catch(err){$('summary').textContent=err.message||'生成できませんでした';}}
$('copyBtn').onclick=async()=>{const text=$('copy').textContent;if(!text)return;await navigator.clipboard.writeText(text);$('copyBtn').textContent='コピーしました';setTimeout(()=>$('copyBtn').textContent='投稿文をコピー',1200)};
$('saveRunBtn').onclick=()=>{if(!preparedAt||!startedAt)return;const runs=JSON.parse(localStorage.getItem('urenavi_v4_self_runs')||'[]');runs.unshift({at:new Date().toISOString(),method:'urenavi',keyword:$('keyword').value.trim(),itemCode:selected?.itemCode||'',seconds:Math.round((preparedAt-startedAt)/1000)});localStorage.setItem('urenavi_v4_self_runs',JSON.stringify(runs.slice(0,100)));$('saved').textContent='自己検証データに保存しました。';renderHistory()};
renderHistory();steps(0);
</script>
</body></html>
