<script>

const SUPABASE_URL=
'https://upooxcugrplfmjnqpuxs.supabase.co';

const SUPABASE_KEY=
'sb_publishable_OBQUoiuGzy_YagoMeAnHYg_BTNfn8j5';

const REAUTH_MS=
30*24*60*60*1000;

const SEND_COOLDOWN_MS=
60*1000;

const SEND_NEXT_KEY=
'urenavi_magic_link_next_send';


const sb=
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      storage:window.localStorage
    }
  }
);


const authGate=
document.getElementById('authGate');

const appRoot=
document.getElementById('appRoot');

const loginEmail=
document.getElementById('loginEmail');

const loginBtn=
document.getElementById('loginBtn');

const authMsg=
document.getElementById('authMsg');

const logoutBtn=
document.getElementById('logoutBtn');

const userMail=
document.getElementById('userMail');


let sendTimer=null;

let sendingLogin=false;

let searching=false;


function setAuthMessage(
  message,
  type=''
){

  authMsg.textContent=
  message;

  authMsg.className=
  'authMsg'+
  (
    type
    ?' '+type
    :''
  );

}


function showLogin(
  message='',
  type=''
){

  appRoot.style.display=
  'none';

  authGate.style.display=
  'flex';

  setAuthMessage(
    message,
    type
  );

  updateLoginButton();

}


function showApp(
  session
){

  authGate.style.display=
  'none';

  appRoot.style.display=
  'block';

  userMail.textContent=
  session?.user?.email||
  '';

}


function sessionTooOld(
  session
){

  const lastSignIn=
  Date.parse(
    session?.user?.last_sign_in_at||
    ''
  );

  if(
    !Number.isFinite(
      lastSignIn
    )
  ){

    return true;

  }

  return(
    Date.now()-
    lastSignIn
    >
    REAUTH_MS
  );

}


function getUrlAuthError(){

  const query=
  new URLSearchParams(
    window.location.search
  );

  const hash=
  new URLSearchParams(
    window.location.hash
    .replace(/^#/,'')
  );

  const code=
  query.get('error_code')||
  hash.get('error_code')||
  '';

  const error=
  query.get('error')||
  hash.get('error')||
  '';

  const description=
  query.get('error_description')||
  hash.get('error_description')||
  '';

  if(
    !code&&
    !error
  ){

    return null;

  }

  const raw=
  (
    code+
    ' '+
    error+
    ' '+
    description
  ).toLowerCase();


  if(
    raw.includes(
      'otp_expired'
    )||
    raw.includes(
      'expired'
    )
  ){

    return(
      'ログインリンクの有効期限が切れています。新しいログインリンクを送ってください。'
    );

  }


  if(
    raw.includes(
      'access_denied'
    )||
    raw.includes(
      'invalid'
    )||
    raw.includes(
      'verification'
    )
  ){

    return(
      'このログインリンクは無効か、すでに使用されています。新しいログインリンクを送ってください。'
    );

  }


  return(
    'ログインを完了できませんでした。新しいログインリンクを送ってください。'
  );

}


function cleanAuthUrl(){

  const hasAuthParams=
  (
    window.location.hash||
    window.location.search
    .includes('error')||
    window.location.search
    .includes('code=')
  );

  if(
    !hasAuthParams
  ){

    return;

  }

  history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

}


function getNextSendTime(){

  return Number(
    localStorage.getItem(
      SEND_NEXT_KEY
    )||
    0
  );

}


function startSendCooldown(){

  localStorage.setItem(
    SEND_NEXT_KEY,
    String(
      Date.now()+
      SEND_COOLDOWN_MS
    )
  );

}


function updateLoginButton(){

  if(
    sendTimer
  ){

    clearTimeout(
      sendTimer
    );

    sendTimer=null;

  }


  if(
    sendingLogin
  ){

    loginBtn.disabled=
    true;

    loginBtn.textContent=
    '送信中…';

    return;

  }


  const next=
  getNextSendTime();

  const remain=
  Math.ceil(
    (
      next-
      Date.now()
    )/
    1000
  );


  if(
    remain>0
  ){

    loginBtn.disabled=
    true;

    loginBtn.textContent=
    `再送まで${remain}秒`;

    sendTimer=
    setTimeout(
      updateLoginButton,
      1000
    );

    return;

  }


  loginBtn.disabled=
  false;

  loginBtn.textContent=
  'ログインリンクを送る';

}


async function logout(
  message=''
){

  try{

    await sb.auth.signOut({
      scope:'local'
    });

  }catch(e){

    console.error(
      e
    );

  }


  showLogin(
    message,
    message
    ?'err'
    :''
  );

}


async function bootAuth(){

  const urlError=
  getUrlAuthError();


  if(
    urlError
  ){

    cleanAuthUrl();

    showLogin(
      urlError,
      'err'
    );

    return;

  }


  try{

    const {
      data:{
        session
      },
      error
    }=
    await sb.auth.getSession();


    if(
      error
    ){

      throw error;

    }


    if(
      !session
    ){

      showLogin();

      return;

    }


    if(
      sessionTooOld(
        session
      )
    ){

      await logout(
        '安全のため、30日ごとに再認証が必要です。新しいログインリンクを送ってください。'
      );

      return;

    }


    showApp(
      session
    );

    cleanAuthUrl();


  }catch(e){

    console.error(
      e
    );

    showLogin(
      'ログイン情報を確認できませんでした。通信状態を確認して、もう一度お試しください。',
      'err'
    );

  }

}


loginBtn.onclick=
async()=>{

  if(
    sendingLogin
  ){

    return;

  }


  const next=
  getNextSendTime();


  if(
    Date.now()<
    next
  ){

    updateLoginButton();

    return;

  }


  const email=
  loginEmail.value
  .trim();


  if(
    !email
  ){

    setAuthMessage(
      'メールアドレスを入力してください。',
      'err'
    );

    return;

  }


  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(
      email
    )
  ){

    setAuthMessage(
      'メールアドレスの形式を確認してください。',
      'err'
    );

    return;

  }


  if(
    !navigator.onLine
  ){

    setAuthMessage(
      'インターネットに接続されていません。通信状態を確認してください。',
      'err'
    );

    return;

  }


  sendingLogin=
  true;

  setAuthMessage(
    ''
  );

  updateLoginButton();


  try{

    const redirectTo=
    window.location.origin+
    '/app.html';


    const {
      error
    }=
    await sb.auth.signInWithOtp({

      email,

      options:{
        shouldCreateUser:false,
        emailRedirectTo:redirectTo
      }

    });


    if(
      error
    ){

      throw error;

    }


    startSendCooldown();


    setAuthMessage(
      'ログインリンクを送信しました。メールを確認して、届いたリンクを押してください。',
      'ok'
    );


  }catch(e){

    console.error(
      e
    );


    const status=
    Number(
      e?.status||
      0
    );


    const raw=
    String(
      (
        e?.code||
        ''
      )+
      ' '+
      (
        e?.message||
        ''
      )
    )
    .toLowerCase();


    if(
      status===429||
      raw.includes(
        'over_email_send_rate_limit'
      )||
      raw.includes(
        'over_request_rate_limit'
      )||
      raw.includes(
        'rate limit'
      )
    ){

      startSendCooldown();

      setAuthMessage(
        'ログインメールの送信回数が上限に達しています。しばらく時間を空けてから再度お試しください。',
        'warn'
      );

    }else if(
      raw.includes(
        'fetch'
      )||
      raw.includes(
        'network'

$('#go').onclick=
async()=>{

  if(
    searching
  ){

    return;

  }


  const keyword=
  k.value
  .trim();


  const min=
  $('#min').value;


  const max=
  $('#max').value;


  const sort=
  $('#sort').value;


  if(
    !keyword
  ){

    $('#st').textContent=
    '商品キーワードを入力してください。';

    return;

  }


  if(
    !sort
  ){

    $('#st').textContent=
    '優先する並びを選択してください。';

    return;

  }


  if(
    min&&
    max&&
    +max<=+min
  ){

    $('#st').textContent=
    '最高価格は最低価格より大きい金額を選んでください。';

    return;

  }


  if(
    !navigator.onLine
  ){

    $('#st').textContent=
    'インターネットに接続されていません。';

    return;

  }


  searching=
  true;


  const go=
  $('#go');


  go.disabled=
  true;


  go.textContent=
  '検索中…';


  $('#st').textContent=
  '検索中…';


  const q=
  new URLSearchParams({
    keyword,
    sort
  });


  if(
    min&&
    min!=='0'
  ){

    q.set(
      'minPrice',
      min
    );

  }


  if(
    max
  ){

    q.set(
      'maxPrice',
      max
    );

  }


  try{

    const {
      data:{
        session
      },
      error:sessionError
    }=
    await sb.auth.getSession();


    if(
      sessionError
    ){

      throw sessionError;

    }


    if(
      !session
    ){

      await logout(
        'ログインの有効期限が切れました。もう一度メール認証してください。'
      );

      return;

    }


    if(
      sessionTooOld(
        session
      )
    ){

      await logout(
        '安全のため、30日ごとに再認証が必要です。新しいログインリンクを送ってください。'
      );

      return;

    }


    const r=
    await fetch(
      '/api/search?'+
      q.toString(),
      {
        headers:{
          Authorization:
          `Bearer ${session.access_token}`
        }
      }
    );


    let d={};


    try{

      d=
      await r.json();

    }catch{

      d={};

    }


    if(
      r.status===401
    ){

      await logout(
        'ログインの有効期限が切れました。もう一度メール認証してください。'
      );

      return;

    }


    if(
      r.status===429
    ){

      throw new Error(
        'アクセスが集中しています。少し時間を空けてから再度お試しください。'
      );

    }


    if(
      !r.ok
    ){

      throw new Error(
        d.message||
        '検索に失敗しました。'
      );

    }


    saveH({
      k:keyword,
      min,
      max,
      sort
    });


    render(
      d.items||
      []
    );


    $('#st').textContent=
    `${
      (
        d.items||
        []
      ).length
    }件をおすすめ順に表示しました。`;


  }catch(e){

    console.error(
      e
    );


    const raw=
    String(
      e?.message||
      ''
    )
    .toLowerCase();


    if(
      raw.includes(
        'fetch'
      )||
      raw.includes(
        'network'
      )||
      raw.includes(
        'failed'
      )
    ){

      $('#st').textContent=
      '通信エラーが発生しました。通信状態を確認して再度お試しください。';

    }else{

      $('#st').textContent=
      'エラー：'+
      (
        e?.message||
        '検索に失敗しました。'
      );

    }


  }finally{

    searching=
    false;


    go.disabled=
    false;


    go.textContent=
    '商品を探して評価する';

  }

};

</script>

</body>
</html>
