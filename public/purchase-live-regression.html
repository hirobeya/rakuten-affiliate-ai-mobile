<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投稿文・実商品回帰検証</title><style>body{font-family:system-ui;background:#f4f6f8;color:#182942;max-width:850px;margin:auto;padding:20px}button,select{padding:12px;margin:5px;font-size:16px}article{background:white;padding:18px;margin:15px 0;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;height:160px}.bad{color:#ae2f22}</style><h1>投稿文・実商品回帰検証</h1><p>Preview・owner専用APIで楽天検索の先頭1商品を実測します。HTTP成功と投稿文完成を分けて記録します。商品間は65秒以上空け、429・認証エラーで停止します。安全性と文章の自然さは原文と出力を照合して確認します。</p><select id="category"></select><button id="one">選択した1件を実測</button><button id="all">未測定を順番に実測</button><button id="stop">停止</button><p id="status">待機中</p><p id="summary"></p><button id="export">結果JSONを表示</button><textarea id="json" readonly></textarea><div id="rows"></div><script>
'use strict';
const CASES=[['バイクグローブ','バイクグローブ'],['収納ベンチ','収納ベンチ'],['モップハンガー','モップハンガー'],['空調服バッテリー','空調服 バッテリー'],['ペット毛取りグローブ','ペット 毛取り グローブ'],['BOS袋','BOS 袋'],['美顔ローラー','美顔ローラー'],['モバイルバッテリー','モバイルバッテリー'],['キッチン用品','フライパン'],['収納用品','収納ボックス'],['美容雑貨','ヘアブラシ'],['ペット用品','ペット ベッド'],['衣類','靴下'],['家電','電気ケトル'],['食品','お米'],['掃除用グローブ','掃除 手袋'],['スポーツ用グローブ','野球 グローブ']];
const $=id=>document.getElementById(id), results={},gapMs=65000;let running=false,stopped=false,lastStarted=0;
$('category').innerHTML=CASES.map(([label],i)=>`<option value="${i}">${label}</option>`).join('');
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},credentials:'include',cache:'no-store',...(body?{body:JSON.stringify(body)}:{})});return {status:r.status,data:await r.json().catch(()=>({}))};}
function render(){const rs=Object.values(results);$('summary').textContent=`実測 ${rs.length}/${CASES.length}件・投稿文完成 ${rs.filter(x=>x.ai?.quality?.status==='ready').length}件・未完成 ${rs.filter(x=>x.ai?.quality?.status!=='ready').length}件（文章品質の合格判定ではありません）`;$('rows').innerHTML=rs.map(x=>`<article><h2>${esc(x.category)}</h2><p>${esc(x.item?.itemName)}</p><p>HTTP ${x.status} / 品質 ${esc(x.ai?.quality?.status||'未完成')} / ${esc((x.ai?.validationReasons||x.ai?.quality?.reasons||[]).join(', '))}</p><pre>${esc(x.ai?.variants?.[0]?.text||x.error||'投稿文なし')}</pre></article>`).join('');}
async function run(indices){if(running)return;running=true;stopped=false;$('one').disabled=$('all').disabled=true;try{for(const i of indices){if(stopped)break;while(Date.now()-lastStarted<gapMs){$('status').textContent=`無料枠の生成間隔を確保中・次：${CASES[i][0]}`;await new Promise(r=>setTimeout(r,1000));if(stopped)break;}if(stopped)break;const [category,keyword]=CASES[i];$('status').textContent=`${category}を実測中`;lastStarted=Date.now();const search=await request('/api/search?'+new URLSearchParams({keyword,sort:'-reviewCount',minPrice:'500',maxPrice:'30000'}));if(search.status!==200||!search.data.items?.length){results[i]={category,keyword,status:search.status,error:search.data.message||'検索商品なし'};render();if([401,403,429].includes(search.status))break;continue;}const x=search.data.items[0],item={itemCode:x.itemCode,itemName:x.itemName,itemCaption:x.itemCaption||'',itemPrice:x.itemPrice};const ai=await request('/api/room-ai-v3',item);results[i]={category,keyword,item,status:ai.status,ai:ai.data,measuredAt:new Date().toISOString()};render();if([401,403,429].includes(ai.status)){$('status').textContent=`HTTP ${ai.status}で停止。自動再試行はしません`;stopped=true;break;}}if(!stopped)$('status').textContent='実測終了。原文との照合と文章品質の評価が必要です';}catch(e){$('status').textContent='実測停止：'+e.message;}finally{running=false;$('one').disabled=$('all').disabled=false;}}
$('one').onclick=()=>run([Number($('category').value)]);$('all').onclick=()=>run(CASES.map((_,i)=>i).filter(i=>!results[i]));$('stop').onclick=()=>{stopped=true;$('status').textContent='停止要求済み';};$('export').onclick=()=>{$('json').value=JSON.stringify({generatedAt:new Date().toISOString(),source:'live_rakuten_search_and_preview_model',cases:CASES,results:Object.values(results)},null,2);};render();
</script></html>
